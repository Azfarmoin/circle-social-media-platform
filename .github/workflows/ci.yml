name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client

  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/circle_e2e
      RATE_LIMIT_DISABLED: "true"
      BCRYPT_ROUNDS: "4"
      PORT: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Start API and web app
        run: |
          (cd server && nohup node src/server.js > ../api.log 2>&1 &)
          (cd client && nohup npx vite --host 127.0.0.1 > ../web.log 2>&1 &)
          npx --yes wait-on http://127.0.0.1:5000/api/health http://127.0.0.1:5173
      - run: npm run e2e
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-traces, path: client/test-results }
